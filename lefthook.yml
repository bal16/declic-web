# Pre-commit hooks (Lefthook). Staged-only: fast (<5s), never touches
# unrelated files. Install once per clone: bunx lefthook install
# Sequential (parallel: false): oxfmt -> oxlint --fix -> boundaries.
# Both fixers re-stage, and boundaries must check the fixed state —
# parallel runs would race on the same staged files and check dirty state.
pre-commit:
  parallel: false
  commands:
    oxfmt:
      # yml/yaml/md included so compose files and the root README are
      # auto-fixed at commit (docs/** prose stays under markdownlint).
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css,yml,yaml,md}'
      # Mirror .oxfmtrc.jsonc ignores: oxfmt errors ("no target file",
      # exit 2) when EVERY staged file is ignored, which aborts the
      # commit. Excluding here keeps hook invocation consistent with
      # what oxfmt would actually format.
      exclude:
        - 'docs/**'
      stage_fixed: true
      run: bunx oxfmt {staged_files}
    oxlint:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      # Re-stage auto-fixes so they land in the same commit.
      stage_fixed: true
      run: bunx oxlint --fix {staged_files}
    boundaries:
      run: bun run boundaries
