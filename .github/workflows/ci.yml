# CI — verify only, no deploys.
#
# Automatic triggers are ENABLED: push to main + pull requests (Phase A
# prep for branch protection per ADR-006 — required checks `verify` +
# `leak-guard` must exist and run before the protection rule can
# reference them). Manual dispatch stays as escape hatch.

name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # Fail-fast order: cheapest checks without build output first
      # (format/lint/boundaries/compose), then typecheck/unit, then
      # build, then e2e (needs build output). Expensive steps run last
      # so style violations don't waste minutes of typecheck/test/build.
      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Lint (oxlint, check mode)
        run: bun run lint

      - name: Module boundaries (ADR-005)
        run: bun run boundaries

      - name: Compose sync check (spec materialized to root)
        run: bun run sync:compose --check

      - name: Docs mirror check (sources embedded in docs/*.md)
        run: bun run sync:docs --check

      - name: Typecheck workspaces
        run: bun run --filter "@declic/*" typecheck

      - name: Test workspaces (unit, src/)
        run: bun run --filter "@declic/*" test

      # Tolerant: api/worker define no `build` script (Bun runs src
      # directly, no emit). The `||` fallback stays until that changes;
      # typecheck/test/test:e2e fallbacks were removed (all workspaces
      # define them — dead branches per ADR-002 §5.5).
      - name: Build workspaces
        run: bun run --filter "@declic/*" build || echo "::notice::build not defined in all workspaces yet — skipping"

      - name: Test workspaces (e2e, test/, needs build output)
        run: bun run --filter "@declic/*" test:e2e

  # Protects the public mirror: apps/web must never reference server secrets
  # or server-side code paths (see ADR-001, docs/adr/ADR-001-monorepo-mirror.md).
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: No server secrets or server paths in apps/web
        run: |
          violations=$(grep -R -l -E "BETTER_AUTH_SECRET|GOOGLE_CLIENT_SECRET|GITHUB_CLIENT_SECRET|S3_SECRET_KEY|apps/(api|worker)" apps/web --exclude-dir=node_modules || true)
          if [ -n "$violations" ]; then
            echo "::error::leak-guard found server references in apps/web:"
            echo "$violations"
            exit 1
          fi
          echo "leak-guard passed"
