# Mirror fan-out (ADR-001, model C1 — docs/adr/ADR-001-monorepo-mirror.md).
#
# Mirror pushes run automatically on every push to main, plus manual
# dispatch. Prerequisites (all DONE): mirror repos exist, per-app deploy
# keys stored as MIRROR_WEB/API/WORKER_KEY secrets.
#
# Deliberately NO branch protection on mirrors: any real protection
# (required PRs/checks, push restrictions) would block the automation's
# force-pushes. Mirrors stay trustworthy through: read-only convention
# (generated README), deploy keys as the sole writers, and full rebuild
# from main on every run (history cannot drift).

name: mirror

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to mirror (empty = all three)'
        required: false
        default: ''
        type: choice
        options: ['', web, api, worker]
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api, worker]
    # NOTE: `matrix` is unavailable in job-level `if` — selection lives on
    # each step. On push events there are no inputs, so everything runs.
    steps:
      - name: Checkout (full history)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == '' || inputs.app == matrix.app }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # No ssh-key here: origin checkout uses GITHUB_TOKEN over HTTPS.
        # Mirror pushes below authenticate with per-app deploy keys because
        # dynamic secret names are unsupported in expressions.

      - name: Set git identity (mirror commits)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == '' || inputs.app == matrix.app }}
        run: |
          git config user.name "declic-mirror-bot"
          git config user.email "declic-mirror-bot@users.noreply.github.com"

      - name: Build mirror branch
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == '' || inputs.app == matrix.app }}
        run: bash scripts/mirror.sh ${{ matrix.app }}

      - name: Push to mirror repo
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == '' || inputs.app == matrix.app }}
        # Deploy keys are per-repo, so each app pushes with its own key
        # (exactly one of the three steps below runs per matrix entry).
        env:
          MIRROR_WEB_KEY: ${{ secrets.MIRROR_WEB_KEY }}
          MIRROR_API_KEY: ${{ secrets.MIRROR_API_KEY }}
          MIRROR_WORKER_KEY: ${{ secrets.MIRROR_WORKER_KEY }}
        run: |
          case "${{ matrix.app }}" in
            web) KEY="$MIRROR_WEB_KEY" ;;
            api) KEY="$MIRROR_API_KEY" ;;
            worker) KEY="$MIRROR_WORKER_KEY" ;;
          esac
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/mirror_push && chmod 600 ~/.ssh/mirror_push
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_push -o StrictHostKeyChecking=accept-new"
          git push --force "git@github.com:bal16/declic-${{ matrix.app }}.git" "mirror-${{ matrix.app }}:main"
